data:
  train_batch_size: 256
  micro_batch_size: 16  # this is also val batch size
  train_files: ./data/continual/sft/0/train.parquet
  val_files: ./data/continual/sft/0/test.parquet
  prompt_key: prompt
  response_key: response
  max_length: 1024
  truncation: error
  balance_dp_token: False
  chat_template: null
model:
  name_or_path: /cpfs04/user/liyuanhang.p/model/llama_base3b
  checkpoint_path: null
  fsdp_config:
    wrap_policy:
      min_num_params: 0
    cpu_offload: False
    offload_params: False
  external_lib: null
  enable_gradient_checkpointing: False
  trust_remote_code: False
optim:
  lr: 1e-5
  betas: [0.9, 0.95]
  weight_decay: 0.01
  warmup_steps_ratio: 0.1
  clip_grad: 1.0

trainer:
  default_local_dir: /nas/shared/sys2/yuanhangli/tmp/llama_base_sft_model
  default_hdfs_dir: /cpfs04/user/liyuanhang.p/tmp/experiments/continual_countdown3b_llama_base/
  resume_path: null
  project_name: countdown-sft-llama-base
  experiment_name: test
  total_epochs: 1
  logger: ['console']
  seed: 1
